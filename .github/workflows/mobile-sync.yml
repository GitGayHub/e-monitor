name: Android App Sync

on:
  push:
    branches:
      - main
    paths:
      - "monitor.py"
      - "config_manager.py"
      - "settings_handlers.py"
      - "config.json.enc"
      - "mobile/app_sync.json"
      - "mobile/build_app_sync.py"
      - "mobile/merge_app_sync_to_config.py"
      - ".github/workflows/mobile-sync.yml"
      - ".github/workflows/e-monitor.yml"
  workflow_dispatch:

concurrency:
  group: android-app-sync
  cancel-in-progress: true

jobs:
  build_sync_manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decrypt config if available
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          if [ -n "$CONFIG_PASSPHRASE" ] && [ -f config.json.enc ]; then
            python config_crypt.py decrypt config.json.enc config.json
          else
            echo "Encrypted config or passphrase is unavailable; preserving existing manifest searches"
          fi

      - name: Build Android sync manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: api_first
        run: |
          if [ -f config.json ]; then
            python mobile/merge_app_sync_to_config.py
          fi
          python mobile/build_app_sync.py

      - name: Commit config and manifest
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          if [ -n "$CONFIG_PASSPHRASE" ] && [ -f config.json ]; then
            python config_crypt.py encrypt config.json config.json.enc
          fi
          git add config.json.enc mobile/app_sync.json
          if git diff --cached --quiet; then
            echo "No Android sync manifest changes"
            exit 0
          fi
          git commit -m "Update Android sync manifest"
          git push
