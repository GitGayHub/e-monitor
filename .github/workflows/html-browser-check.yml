name: HTML browser startup check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium_render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer package
        run: python -m pip install --disable-pip-version-check --timeout 20 --retries 1 playwright
      - name: Check the actual monitor renderer preparation
        run: python qa/prepare_html_browser.py
