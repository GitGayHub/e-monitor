name: Audit eBay API usage
on:
  workflow_dispatch:
    inputs:
      key_slot:
        description: 'Production key to verify (no monitor state changes)'
        type: choice
        options: ['2', '3']
        default: '2'
permissions:
  contents: read
concurrency:
  group: qa-api-usage-readonly
  cancel-in-progress: false
jobs:
  verify_selected_key:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify selected key without changing monitor state
        env:
          EBAY_KEY_SLOT: ${{ inputs.key_slot || '2' }}
          EBAY_CLIENT_ID_2: ${{ secrets.EBAY_CANDIDATE_CLIENT_ID || secrets.EBAY_CLIENT_ID_2 }}
          EBAY_CLIENT_SECRET_2: ${{ secrets.EBAY_CANDIDATE_CLIENT_SECRET || secrets.EBAY_CLIENT_SECRET_2 }}
          EBAY_CLIENT_ID_3: ${{ secrets.EBAY_CLIENT_ID_3 }}
          EBAY_CLIENT_SECRET_3: ${{ secrets.EBAY_CLIENT_SECRET_3 }}
        run: python qa/api_usage_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-usage-proof
          path: api-usage-proof.json
          retention-days: 7
