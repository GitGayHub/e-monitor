name: E Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: e-monitor
  cancel-in-progress: true

jobs:
  check_e:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    permissions:
      contents: write

    steps:
      - name: Cooldown check
        id: cooldown
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Find last REAL run (took >30s, ignoring quick cooldown-skips)
          LAST_RUN=$(curl -s -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&per_page=5" \
            | jq -r '[.workflow_runs[] | select((.updated_at | fromdateiso8601) - (.created_at | fromdateiso8601) > 30)][0].created_at // empty')
          if [ -n "$LAST_RUN" ]; then
            LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_EPOCH))
            echo "Last real run was ${DIFF}s ago"
            if [ $DIFF -lt 840 ]; then
              echo "Too soon (< 14 min), skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt config
        if: steps.cooldown.outputs.skip != 'true'
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          python config_crypt.py decrypt config.json.enc config.json


      - name: Run monitor once
        if: steps.cooldown.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
        run: |
          python monitor.py --once 2>&1 | tee run_output.log
          # Append mini-log entry
          python -c "
          import json, os
          from datetime import datetime, timezone
          log_file = 'run_log.json'
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file) as f: logs = json.load(f)
              except: logs = []
          output = open('run_output.log').read()
          new_items = output.count('send_notification') + output.count('🆕') + output.count('🚨')
          blocked = 'cooldown' in output or 'blocked' in output.lower()
          trigger = '${{ github.event_name }}'
          entry = {
              'time': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'trigger': trigger,
              'new': new_items,
              'blocked': blocked,
              'source': 'api' if 'Browse API' in output else 'html',
          }
          if trigger == 'workflow_dispatch' and len(logs) > 0:
              try:
                  last_t = logs[-1].get('time','')
                  from datetime import datetime as dt2
                  lt = dt2.strptime(last_t, '%Y-%m-%d %H:%M UTC')
                  gap = (datetime.now(timezone.utc).replace(tzinfo=None) - lt).total_seconds() / 60
                  entry['trigger'] = 'cron-job.org' if gap > 20 else 'self-trigger'
              except: entry['trigger'] = 'dispatch'
          logs.append(entry)
          logs = logs[-50:]
          with open(log_file, 'w') as f: json.dump(logs, f, indent=1)
          print(f'Log: {entry}')
          "
          rm -f run_output.log

      - name: Commit runtime state
        if: steps.cooldown.outputs.skip != 'true'
        shell: bash
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          set -e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          backup_dir="$(mktemp -d)"
          for f in seen_ids.json config.json config.json.enc price_history.db run_log.json; do
            if [ -f "$f" ]; then
              mkdir -p "$backup_dir/$(dirname "$f")"
              cp "$f" "$backup_dir/$f"
            fi
          done
          git checkout -- seen_ids.json config.json.enc price_history.db run_log.json 2>/dev/null || true
          git fetch origin main || true
          if ! git rebase origin/main; then
            git rebase --abort || true
          fi
          for f in seen_ids.json config.json config.json.enc price_history.db run_log.json; do
            if [ -f "$backup_dir/$f" ]; then
              cp "$backup_dir/$f" "$f"
            fi
          done
          # Re-encrypt config before committing
          python config_crypt.py encrypt config.json config.json.enc
          git add seen_ids.json config.json.enc price_history.db run_log.json || true
          if git diff --cached --quiet; then
            echo "No runtime state changes"
            exit 0
          fi
          git commit -m "Update monitor state"
          if ! git push; then
            git reset --mixed HEAD~1
            echo "WARNING: push failed; state kept in working tree"
            exit 0
          fi

      - name: Trigger next run
        if: steps.cooldown.outputs.skip != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not set, skipping self-trigger"
            exit 0
          fi
          echo "Scheduling next run via workflow_dispatch..."
          sleep 10
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/e-monitor.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run triggered"
