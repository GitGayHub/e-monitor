name: E Monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - "seen_ids.json"
      - "config.json.enc"
      - "price_history.db"
      - "run_log.json"
      - "mobile/app_sync.json"
      - "details_test_output.json"
      - "monitor_debug_tail.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # Exactly ONE e-monitor at a time (push/schedule/manual share the group).
  # Parallel runners (old unique-per-dispatch groups) hammer eBay and turn
  # half of statistics into soft-blocks. Do NOT cancel-in-progress:
  # statistics needs ~15–40 min; a 5‑min cron must wait, not kill mid-run.
  group: e-monitor-v2
  cancel-in-progress: false

jobs:
  check_e:
    runs-on: ubuntu-latest
    # Statistics (4 buckets × every product + live details) exceeds 20 min.
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Decrypt config
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          python config_crypt.py decrypt config.json.enc config.json

      - name: Run monitor loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_BACKUP: ${{ secrets.TELEGRAM_BOT_TOKEN_BACKUP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          # HTML first (curl_cffi + m.ebay + Playwright). Browse API only last resort.
          EBAY_SOURCE: auto
          EBAY_HTML_PLAYWRIGHT: "1"
          EBAY_HTML_MOBILE_FIRST: "1"
          # GitHub's 5-min cron is best effort and regularly lands 10–40 min
          # late, which is what made alerts arrive an hour after the listing.
          # So one run keeps sweeping for its whole budget instead of doing two
          # passes and waiting for the scheduler; the concurrency group makes
          # the next run queue up right behind it.
          RUN_INTERVAL_SEC: 60
          RUN_BUDGET_SEC: 2100
        run: |
          set +e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          MONITOR_MODE="$(tr -d '\r\n[:space:]' < mode.txt 2>/dev/null || echo normal)"
          # Statistics already hammers eBay for 15–40 min. Cron every 5 min would
          # stack 2–3 parallel runners and turn half the report into blocks.
          if [ "$MONITOR_MODE" = "statistics" ] && [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "Skip scheduled run while mode=statistics (push/manual only)."
            echo "mode=statistics schedule_skip=1" | tee run_output.log
            exit 0
          fi
          : > run_output_all.log
          loop_start=$SECONDS
          i=0
          while :; do
            i=$((i+1))
            echo "===== E MONITOR ITERATION $i (budget ${RUN_BUDGET_SEC}s) =====" | tee -a run_output_all.log
            echo "iteration_start=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee -a run_output_all.log

            python monitor.py --once 2>&1 | tee run_output.log
            MONITOR_STATUS=${PIPESTATUS[0]}
            cat run_output.log >> run_output_all.log

            MONITOR_STATUS="$MONITOR_STATUS" LOOP_INDEX="$i" python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          log_file = 'run_log.json'
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file) as f:
                      logs = json.load(f)
              except Exception:
                  logs = []

          output = ''
          if os.path.exists('run_output.log'):
              output = open('run_output.log', encoding='utf-8', errors='ignore').read()
          lower = output.lower()

          # Classify carefully: logs say "no cooldown" on GH soft-blocks and
          # "eBay block #N" per product without meaning the whole run died.
          reason = ''
          has_rl = (
              'rate_limit' in lower
              or 'rate limit' in lower
              or 'api circuit open' in lower
              or 'http 429' in lower
          )
          # "no cooldown" must NOT count as cooldown (common GH log line).
          has_cooldown = (
              ('cooldown active' in lower or 'cooling down' in lower or "cooldown'" in lower)
              and 'no cooldown' not in lower
          )
          # Sustained/whole-run block signals only (not every "eBay block #1 for …").
          has_hard_block = (
              'sustained block' in lower
              or 'stealth empty' in lower
              or 'still got challenge' in lower
          )
          # API last-resort appears for a few soft products every run — only flag
          # when many products actually fail the API fallback (mass outage).
          api_fail_n = lower.count('api last-resort failed')
          api_try_n = lower.count('browse api last resort') + lower.count(
              'trying browse api last resort'
          )
          has_mass_api_fallback = api_fail_n >= 5

          if has_rl:
              reason = 'rate_limit'
          elif has_cooldown:
              reason = 'cooldown'
          elif has_hard_block:
              reason = 'blocked'
          elif has_mass_api_fallback:
              reason = 'fallback'

          telegram_failed = (
              'failed to send message via bot' in lower
              or 'ошибка отправки' in lower
              or 'telegram send failed' in lower
              or 'telegram error' in lower
              or 'telegram exception' in lower
          )

          # Source: HTML is primary; mark api only when API actually returned items
          # or dominated the run (not a single last-resort attempt).
          html_hits = lower.count('items via m.ebay') + lower.count('items via ebay.')
          api_hits = lower.count('via ebay browse api')
          if api_hits > 0 and api_hits >= html_hits:
              src = 'api'
          elif html_hits > 0 or 'playwright html' in lower or 'm.ebay' in lower:
              src = 'html'
          elif api_try_n > 0:
              src = 'mixed'
          else:
              src = 'unknown'

          entry = {
              'time': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'trigger': os.environ.get('GITHUB_EVENT_NAME', '${{ github.event_name }}'),
              'loop_index': int(os.environ.get('LOOP_INDEX') or 0),
              'new': output.count('send_notification') + output.count('🆕') + output.count('🚨'),
              'blocked': bool(reason),
              'blocked_reason': reason,
              'source': src,
              'monitor_status': int(os.environ.get('MONITOR_STATUS') or 0),
              'telegram_failed': telegram_failed,
          }
          logs.append(entry)
          logs = logs[-300:]
          with open(log_file, 'w') as f:
              json.dump(logs, f, indent=1)
          print(f'Log: {entry}')
          PY

            git add seen_ids.json price_history.db run_log.json || true
            [ -f mobile/app_sync.json ] && git add mobile/app_sync.json
            [ -f details_test_output.json ] && git add details_test_output.json
            [ -f monitor_debug_tail.txt ] && git add monitor_debug_tail.txt
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint monitor state"
              # seen_ids must reach origin so the next run does not re-notify.
              push_ok=0
              for attempt in 1 2 3 4 5; do
                git pull --rebase --autostash origin main || true
                if git push; then
                  push_ok=1
                  break
                fi
                echo "Checkpoint push failed (attempt $attempt/5), retrying..."
                sleep 3
              done
              if [ "$push_ok" -ne 1 ]; then
                echo "ERROR: failed to push checkpoint state after 5 attempts" >&2
                exit 1
              fi
            fi

            # The 4-bucket report is one long diagnostic pass, never a loop.
            if [ "$MONITOR_MODE" = "statistics" ]; then
              echo "statistics mode — single pass, done" | tee -a run_output_all.log
              break
            fi
            elapsed=$(( SECONDS - loop_start ))
            if [ $(( RUN_BUDGET_SEC - elapsed )) -le "$RUN_INTERVAL_SEC" ]; then
              echo "run budget spent after ${elapsed}s and $i pass(es)" | tee -a run_output_all.log
              break
            fi
            sleep "$RUN_INTERVAL_SEC"
          done

          tail -n 240 run_output_all.log > monitor_debug_tail.txt
          rm -f run_output.log run_output_all.log

      - name: Build Android sync manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
        run: |
          python mobile/build_app_sync.py

      - name: Commit runtime state
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          set -e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          git add seen_ids.json price_history.db run_log.json || true
          [ -f mobile/app_sync.json ] && git add mobile/app_sync.json
          [ -f details_test_output.json ] && git add details_test_output.json
          [ -f monitor_debug_tail.txt ] && git add monitor_debug_tail.txt
          if git diff --cached --quiet; then
            echo "No runtime state changes"
            exit 0
          fi
          git commit -m "Update monitor state"
          push_ok=0
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              push_ok=1
              break
            fi
            echo "Final state push failed (attempt $attempt/5), retrying..."
            sleep 3
          done
          if [ "$push_ok" -ne 1 ]; then
            echo "ERROR: failed to push final monitor state after 5 attempts" >&2
            exit 1
          fi

# Trigger: 2026-07-01T07:22:00Z
