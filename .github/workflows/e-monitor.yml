name: E Monitor

on:
  push:
    branches:
      - main
    paths-ignore:
      - "seen_ids.json"
      - "config.json.enc"
      - "price_history.db"
      - "run_log.json"
      - "mobile/app_sync.json"
      - "details_test_output.json"
      - "monitor_debug_tail.txt"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: e-monitor-v2
  cancel-in-progress: true

jobs:
  check_e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt config
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          python config_crypt.py decrypt config.json.enc config.json

      - name: Run monitor loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_BACKUP: ${{ secrets.TELEGRAM_BOT_TOKEN_BACKUP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
          RUN_INTERVAL_SEC: 120
          RUN_ITERATIONS: 3
        run: |
          set +e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          : > run_output_all.log
          for i in $(seq 1 "$RUN_ITERATIONS"); do
            echo "===== E MONITOR ITERATION $i/$RUN_ITERATIONS =====" | tee -a run_output_all.log
            echo "iteration_start=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" | tee -a run_output_all.log

            python monitor.py --once 2>&1 | tee run_output.log
            MONITOR_STATUS=${PIPESTATUS[0]}
            cat run_output.log >> run_output_all.log

            MONITOR_STATUS="$MONITOR_STATUS" LOOP_INDEX="$i" python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          log_file = 'run_log.json'
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file) as f:
                      logs = json.load(f)
              except Exception:
                  logs = []

          output = ''
          if os.path.exists('run_output.log'):
              output = open('run_output.log', encoding='utf-8', errors='ignore').read()
          lower = output.lower()

          reason = ''
          if 'rate_limit' in lower or 'rate limit' in lower:
              reason = 'rate_limit'
          elif 'cooldown' in lower:
              reason = 'cooldown'
          elif 'blocked' in lower:
              reason = 'blocked'
          elif 'api fallback' in lower or 'fallback' in lower:
              reason = 'fallback'

          telegram_failed = (
              'failed to send message via bot' in lower
              or 'ошибка отправки' in lower
              or ('telegram' in lower and ('error' in lower or 'exception' in lower))
          )

          entry = {
              'time': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'trigger': os.environ.get('GITHUB_EVENT_NAME', '${{ github.event_name }}'),
              'loop_index': int(os.environ.get('LOOP_INDEX') or 0),
              'new': output.count('send_notification') + output.count('🆕') + output.count('🚨'),
              'blocked': bool(reason),
              'blocked_reason': reason,
              'source': 'api' if 'api' in lower else 'html',
              'monitor_status': int(os.environ.get('MONITOR_STATUS') or 0),
              'telegram_failed': telegram_failed,
          }
          logs.append(entry)
          logs = logs[-300:]
          with open(log_file, 'w') as f:
              json.dump(logs, f, indent=1)
          print(f'Log: {entry}')
          PY

            python config_crypt.py encrypt config.json config.json.enc
            git add seen_ids.json config.json.enc price_history.db run_log.json || true
            [ -f mobile/app_sync.json ] && git add mobile/app_sync.json
            [ -f details_test_output.json ] && git add details_test_output.json
            [ -f monitor_debug_tail.txt ] && git add monitor_debug_tail.txt
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint monitor state"
              git pull --rebase --autostash origin main || true
              git push || (git pull --rebase --autostash origin main && git push) || true
            fi

            if [ "$i" -lt "$RUN_ITERATIONS" ]; then
              sleep "$RUN_INTERVAL_SEC"
            fi
          done

          tail -n 240 run_output_all.log > monitor_debug_tail.txt
          rm -f run_output.log run_output_all.log

      - name: Build Android sync manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
        run: |
          python mobile/build_app_sync.py

      - name: Commit runtime state
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          set -e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          python config_crypt.py encrypt config.json config.json.enc
          git add seen_ids.json config.json.enc price_history.db run_log.json || true
          [ -f mobile/app_sync.json ] && git add mobile/app_sync.json
          [ -f details_test_output.json ] && git add details_test_output.json
          [ -f monitor_debug_tail.txt ] && git add monitor_debug_tail.txt
          if git diff --cached --quiet; then
            echo "No runtime state changes"
            exit 0
          fi
          git commit -m "Update monitor state"
          git pull --rebase --autostash origin main || true
          git push || (git pull --rebase --autostash origin main && git push) || true
