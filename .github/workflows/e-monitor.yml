name: E Monitor

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:

concurrency:
  group: e-monitor-v2
  cancel-in-progress: true

jobs:
  check_e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decrypt config
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          python config_crypt.py decrypt config.json.enc config.json

      - name: Run monitor once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN_BACKUP: ${{ secrets.TELEGRAM_BOT_TOKEN_BACKUP }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
        run: |
          python test_html_details_live.py
          python monitor.py --once 2>&1 | tee run_output.log
          python -c "
          import json, os
          from datetime import datetime, timezone
          log_file = 'run_log.json'
          logs = []
          if os.path.exists(log_file):
              try:
                  with open(log_file) as f: logs = json.load(f)
              except Exception:
                  logs = []
          output = open('run_output.log', encoding='utf-8', errors='ignore').read()
          entry = {
              'time': datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC'),
              'trigger': '${{ github.event_name }}',
              'new': output.count('send_notification') + output.count('🆕') + output.count('🚨'),
              'blocked': 'blocked' in output.lower() or 'cooldown' in output.lower(),
              'source': 'api' if 'api' in output.lower() else 'html',
          }
          logs.append(entry)
          logs = logs[-50:]
          with open(log_file, 'w') as f: json.dump(logs, f, indent=1)
          print(f'Log: {entry}')
          "
          rm -f run_output.log

      - name: Build Android sync manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBAY_MARKETPLACE_ID: EBAY_DE
          EBAY_SOURCE: auto
        run: |
          python mobile/build_app_sync.py

      - name: Commit runtime state
        env:
          CONFIG_PASSPHRASE: ${{ secrets.CONFIG_PASSPHRASE }}
        run: |
          set -e
          git config --global user.name "E Bot"
          git config --global user.email "bot@noreply.github.com"
          python config_crypt.py encrypt config.json config.json.enc
          git add seen_ids.json config.json.enc price_history.db run_log.json mobile/app_sync.json details_test_output.json || true
          if git diff --cached --quiet; then
            echo "No runtime state changes"
            exit 0
          fi
          git commit -m "Update monitor state"
          git pull --rebase origin main || true
          git push || true
