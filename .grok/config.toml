# Project-scoped MCP servers for e-monitor (Grok reads [mcp_servers] from repo .grok/config.toml).
# Absolute paths below are for the original Windows machine — edit on a new PC.

# Headless Chromium only — never opens a visible window
[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@latest",
    "--headless",
    "--browser",
    "chromium",
]
enabled = true
startup_timeout_sec = 120
tool_timeout_sec = 120

# Requires Bebranoid repo (or a copy of mcp-telegram-session) on this machine
[mcp_servers.bebranoid-telegram]
command = "node"
args = ["C:/VibeCoding/Bebranoid/mcp-telegram-session/server.js"]
enabled = true
startup_timeout_sec = 15

[mcp_servers.bebranoid-verify]
command = "node"
args = ["C:/VibeCoding/Bebranoid/mcp-bebranoid-verify/server.js"]
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 180

# Read e-monitor statistics from GitHub Actions logs (same as Telegram report).
# Does NOT open or control the user's Telegram desktop — silent/background.
# CHANGE python path / repo path on another PC if needed.
[mcp_servers.e-monitor-stats]
command = "C:/VibeCoding/e-monitor/.venv/Scripts/python.exe"
args = ["C:/VibeCoding/e-monitor/qa/mcp_stats_server.py"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 180
